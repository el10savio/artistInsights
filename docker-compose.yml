services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: artistinsights_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: artist_insights
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  server:
    build: .
    container_name: artistinsights_server
    ports:
      - "8080:8080"
    environment:
      CH_HOST: clickhouse
      CH_PORT: "9000"
      CH_DB: artist_insights
      CH_USER: admin
      CH_PASS: pass
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  clickhouse-logs:
